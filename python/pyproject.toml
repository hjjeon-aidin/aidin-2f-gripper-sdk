[build-system]
requires = ["setuptools>=61", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "aidin-gripper"
version = "1.2.0"
description = "Python SDK for the AIDIN BLDC gripper (DH-Robotics Modbus RTU)."
readme = "README.md"
requires-python = ">=3.8"
license = { text = "MIT" }
authors = [{ name = "AIDIN Robotics Firmware Team" }]
keywords = ["modbus", "gripper", "aidin", "bldc", "robotics"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Operating System :: POSIX :: Linux",
    "Operating System :: Microsoft :: Windows",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.8",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: System :: Hardware",
]
dependencies = [
    # 3.0.x needs the optional pyserial-asyncio extra for its serial client;
    # 3.1 - 3.9 take slave=, 3.10+ device_id= (the SDK picks the right one).
    "pymodbus>=3.1,<4.0",
    "pyserial>=3.5",
]

[project.urls]
Homepage = "https://github.com/hjjeon-aidin/aidin-2f-gripper-sdk"
Documentation = "https://github.com/hjjeon-aidin/aidin-2f-gripper-sdk/blob/main/python/README.md"
Issues = "https://github.com/hjjeon-aidin/aidin-2f-gripper-sdk/issues"

[tool.setuptools.packages.find]
include = ["aidin_gripper*"]
exclude = ["examples*", "tests*"]
